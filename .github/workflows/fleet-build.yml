name: fleet-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: false
        default: 'fleet-v2.338.2.1'
      prerelease:
        description: 'Mark the release prerelease'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        run: git clone --filter=blob:none --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .

      - name: Layout (build)
        run: ./dev.sh layout Release linux-x64
        working-directory: src

      - name: L0 tests
        run: ./dev.sh test
        working-directory: src

      - name: Package
        run: ./dev.sh package Release linux-x64
        working-directory: src

      - name: Checksums
        run: |
          cd _package
          sha256sum *.tar.gz | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            _package/actions-runner-linux-x64-*.tar.gz _package/SHA256SUMS \
            --title "fleet v2.338.2 + #4729 (Busy poll kept open at completion)" \
            --notes "Custom fleet build: official v2.338.2 + actions/runner#4729 (keep the Busy long-poll open when a job completes; fixes the acquirejob 409 MissingKey job-drop wedge of actions/runner#4728). Version string intentionally kept 2.338.2. Revert to official builds once #4729 ships in an official release." \
            ${{ inputs.prerelease == 'true' && '--prerelease' || '' }} \
            || gh release upload "${{ inputs.tag }}" --clobber _package/actions-runner-linux-x64-*.tar.gz _package/SHA256SUMS
